<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zynora AI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0b1020;
      color: white;
      min-height: 100vh;
    }

    .container {
      max-width: 500px;
      margin: auto;
      padding: 25px 18px;
      text-align: center;
    }

    .logo {
      font-size: 42px;
      font-weight: bold;
      margin-top: 30px;
      color: #7c5cff;
    }

    .subtitle {
      margin-top: 10px;
      color: #b8bfd6;
      font-size: 17px;
      line-height: 1.6;
    }

    .card {
      background: #151c32;
      border-radius: 22px;
      padding: 25px 20px;
      margin-top: 35px;
      border: 1px solid #293252;
    }

    .camera {
      font-size: 70px;
      margin-bottom: 15px;
    }

    h2 {
      margin-bottom: 10px;
    }

    .description {
      color: #aeb6ce;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 16px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      background: #7c5cff;
      color: white;
    }

    button:active {
      transform: scale(0.98);
    }

    .result {
      display: none;
      margin-top: 25px;
      padding: 18px;
      background: #0f1629;
      border-radius: 15px;
      text-align: right;
    }

    .result h3 {
      color: #8d75ff;
      margin-bottom: 8px;
    }

    .footer {
      margin-top: 35px;
      color: #737c99;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">Zynora AI</div>

    <p class="subtitle">
      اكتشف العالم من حولك بذكاء ✨
    </p>

    <div class="card">

      <div class="camera">📷</div>

      <h2>ماذا يوجد حولك؟</h2>

      <p class="description">
        صوّر شيئًا من حولك، ودع Zynora AI يساعدك على معرفة المزيد عنه.
      </p>

      <button onclick="startCamera()">
        ابدأ الاكتشاف 🚀
      </button>

      <div class="result" id="result">
        <h3>مرحبًا بك في Zynora AI!</h3>
        <p>
          ميزة التعرف على الأشياء بالذكاء الاصطناعي ستكون هنا في الخطوة القادمة.
        </p>
      </div>

    </div>

    <div class="footer">
      Zynora AI © 2026
    </div>

  </div>

  <script>
    function startCamera() {
      document.getElementById("result").style.display = "block";
    }
  </script>

</body>
</html>
<!-- Zynora AI -->
